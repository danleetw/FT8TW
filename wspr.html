<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FT8TW User Manual</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="wspr">

  <div class="layout">
    <main class="main-content" id="mainContent">

      <section id="wspr">
        <h2 data-i18n="wspr_title"></h2>
        <p data-i18n="wspr_intro"></p>
        <div class="screenshot-wrap">
          <img class="screenshot" data-lang-img="en" src="assets/screenshots/en/wspr.png" alt="WSPR beacon screen">
          <img class="screenshot" data-lang-img="zh-TW" style="display:none" src="assets/screenshots/zh-TW/wspr.png" alt="WSPR 信標畫面">
        </div>

        <h3 data-i18n="wspr_what_title"></h3>
        <p data-i18n-html="wspr_what_text"></p>
        <div data-i18n-html="wspr_what_list"></div>

        <h3 data-i18n="wspr_quick_title"></h3>
        <p data-i18n-html="wspr_quick_text"></p>
        <div data-i18n-html="wspr_quick_steps"></div>
        <div class="note" data-i18n-html="wspr_quick_note"></div>

        <h3 data-i18n="wspr_tx_title"></h3>
        <p data-i18n="wspr_tx_text"></p>
        <div data-i18n-html="wspr_tx_list"></div>

        <h3 data-i18n="wspr_callsign_title"></h3>
        <p data-i18n-html="wspr_callsign_text"></p>
        <p data-i18n-html="wspr_callsign_compound"></p>

        <h3 data-i18n="wspr_rx_title"></h3>
        <p data-i18n="wspr_rx_text"></p>
      </section>

      <footer>
        <p data-i18n="footer_text"></p>
      </footer>

    </main>
  </div>

  <script src="assets/i18n/common.js"></script>
  <script src="assets/i18n/wspr.js"></script>
  <script src="assets/layout.js"></script>
</body>
</html>
