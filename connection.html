<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FT8TW User Manual</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="connection">

  <div class="layout">
    <main class="main-content" id="mainContent">

      <section id="connection">
        <h2 data-i18n="conn_title"></h2>
        <p data-i18n="conn_intro"></p>

        <h3 data-i18n="conn_vox_title"></h3>
        <p data-i18n="conn_vox_text"></p>
        <p><em data-i18n="conn_vox_use"></em></p>

        <h3 data-i18n="conn_usb_title"></h3>
        <p data-i18n="conn_usb_text"></p>
        <div data-i18n-html="conn_usb_steps"></div>
        <div class="screenshot-wrap">
          <img class="screenshot" data-lang-img="en" src="assets/screenshots/en/connection.png" alt="Radio connection settings">
          <img class="screenshot" data-lang-img="zh-TW" style="display:none" src="assets/screenshots/zh-TW/connection.png" alt="電台連線設定">
        </div>

        <h3 data-i18n="conn_bt_title"></h3>
        <p data-i18n="conn_bt_text"></p>
        <div data-i18n-html="conn_bt_modes"></div>

        <h3 data-i18n="conn_flex_title"></h3>
        <p data-i18n="conn_flex_text"></p>
        <div data-i18n-html="conn_flex_steps"></div>

        <h3 data-i18n="conn_icom_title"></h3>
        <p data-i18n="conn_icom_text"></p>
        <div data-i18n-html="conn_icom_steps"></div>

        <h3 data-i18n="conn_xiegu_title"></h3>
        <p data-i18n="conn_xiegu_text"></p>
      </section>

      <footer>
        <p data-i18n="footer_text"></p>
      </footer>

    </main>
  </div>

  <script src="assets/i18n/common.js"></script>
  <script src="assets/i18n/connection.js"></script>
  <script src="assets/layout.js"></script>
</body>
</html>
