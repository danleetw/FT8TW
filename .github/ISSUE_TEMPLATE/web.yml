name: 網頁版問題回報（Web version）
description: FT8TW 網頁版（ft8tw.bv6lc.com）的問題或建議 / Problems or suggestions for the FT8TW web version
title: "[網頁版] "
labels: ["網頁版"]
body:
  - type: markdown
    attributes:
      value: |
        感謝回報！這裡是 **FT8TW 網頁版**（ft8tw.bv6lc.com）的問題回報；Android App 的問題請改用一般 issue。
        Thanks for reporting! This form is for the **FT8TW web version**; for the Android app, please open a regular issue.
  - type: input
    id: version
    attributes:
      label: 版本號 / Version
      description: 在網頁「設置 › 關於」可以直接複製，例如 1.26.1009-prd.306 / Copy it from Settings › About, e.g. 1.26.1009-prd.306
      placeholder: 1.26.1009-prd.306
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 問題說明 / What happened
      description: 發生了什麼事、怎麼重現、你預期的結果 / What happened, how to reproduce it, and what you expected
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 診斷資料 / Diagnostics
      description: |
        在網頁「設置 › 進階與開發者」按「複製診斷資料」，或在「設置 › 關於」按「回報問題」→「複製並開啟 GitHub」，然後貼在這裡。預設已遮蔽呼號與網格（顯示成 <呼號>、<網格>），不想附的內容可以先刪掉。
        Copy the diagnostics from Settings › Advanced & Developer (or Settings › About › Report an Issue) and paste them here. Your callsign and grid are hidden by default.
      placeholder: 在這裡貼上診斷資料（Ctrl+V） / Paste the diagnostics here (Ctrl+V)
    validations:
      required: false
