<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FT8TW User Manual</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="ssb">

  <div class="layout">
    <main class="main-content" id="mainContent">

      <section id="ssb">
        <h2 data-i18n="ssb_title"></h2>
        <p data-i18n="ssb_intro"></p>
        <div class="screenshot-wrap">
          <img class="screenshot" data-lang-img="en" src="assets/screenshots/en/ssb.png" alt="SSB push-to-talk screen">
          <img class="screenshot" data-lang-img="zh-TW" style="display:none" src="assets/screenshots/zh-TW/ssb.png" alt="SSB 按住通話畫面">
        </div>

        <h3 data-i18n="ssb_use_title"></h3>
        <p data-i18n="ssb_use_text"></p>
        <div data-i18n-html="ssb_use_list"></div>

        <h3 data-i18n="ssb_disabled_title"></h3>
        <p data-i18n="ssb_disabled_text"></p>
        <div data-i18n-html="ssb_disabled_list"></div>

        <h3 data-i18n="ssb_monitor_title"></h3>
        <p data-i18n="ssb_monitor_text"></p>

        <h3 data-i18n="ssb_tune_title"></h3>
        <p data-i18n="ssb_tune_text"></p>
        <div class="warn" data-i18n-html="ssb_tune_warn"></div>
        <div data-i18n-html="ssb_tune_list"></div>

        <h3 data-i18n="ssb_safety_title"></h3>
        <p data-i18n="ssb_safety_text"></p>
      </section>

      <footer>
        <p data-i18n="footer_text"></p>
      </footer>

    </main>
  </div>

  <script src="assets/i18n/common.js"></script>
  <script src="assets/i18n/ssb.js"></script>
  <script src="assets/layout.js"></script>
</body>
</html>
