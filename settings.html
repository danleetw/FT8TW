<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FT8TW User Manual</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="settings">

  <div class="layout">
    <main class="main-content" id="mainContent">

      <section id="settings">
        <h2 data-i18n="set_title"></h2>
        <div class="screenshot-wrap">
          <img class="screenshot" data-lang-img="en" src="assets/screenshots/en/settings.png" alt="Settings screen">
          <img class="screenshot" data-lang-img="zh-TW" style="display:none" src="assets/screenshots/zh-TW/settings.png" alt="設置畫面">
        </div>

        <h3 data-i18n="set_profile_title"></h3>
        <p data-i18n="set_profile_text"></p>
        <div class="note" data-i18n-html="set_profile_note"></div>
        <div class="screenshot-wrap">
          <img class="screenshot" src="assets/screenshots/settings-profile.png" alt="">
          <p class="screenshot-caption" data-i18n="set_profile_caption"></p>
        </div>

        <h3 data-i18n="set_menu_title"></h3>
        <p data-i18n="set_menu_text"></p>
        <div data-i18n-html="set_menu_list"></div>

        <h3 data-i18n="set_station_title"></h3>
        <div data-i18n-html="set_station_table"></div>

        <h3 data-i18n="set_op_title"></h3>
        <div data-i18n-html="set_op_table"></div>

        <h3 data-i18n="set_radio_title"></h3>
        <div data-i18n-html="set_radio_table"></div>

        <h3 data-i18n="set_services_title"></h3>
        <div data-i18n-html="set_services_table"></div>

        <h3 data-i18n="set_activation_title"></h3>
        <div data-i18n-html="set_activation_table"></div>

        <h3 data-i18n="set_display_title"></h3>
        <div data-i18n-html="set_display_table"></div>

        <h3 data-i18n="set_backup_title"></h3>
        <div data-i18n-html="set_backup_table"></div>

        <h3 data-i18n="set_advanced_title"></h3>
        <div data-i18n-html="set_advanced_table"></div>
      </section>

      <footer>
        <p data-i18n="footer_text"></p>
      </footer>

    </main>
  </div>

  <script src="assets/i18n/common.js"></script>
  <script src="assets/i18n/settings.js"></script>
  <script src="assets/layout.js"></script>
</body>
</html>
