<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FT8TW User Manual</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="troubleshoot">

  <div class="layout">
    <main class="main-content" id="mainContent">

      <section id="troubleshoot">
        <h2 data-i18n="ts_title"></h2>

        <h3 data-i18n="ts_nodecode_title"></h3>
        <div data-i18n-html="ts_nodecode_list"></div>

        <h3 data-i18n="ts_noconn_title"></h3>
        <div data-i18n-html="ts_noconn_list"></div>

        <h3 data-i18n="ts_usb_title"></h3>
        <p data-i18n-html="ts_usb_intro"></p>
        <div data-i18n-html="ts_usb_list"></div>

        <h3 data-i18n="ts_audio_title"></h3>
        <p data-i18n-html="ts_audio_intro"></p>
        <div class="screenshot-wrap">
          <img class="screenshot" data-lang-img="en" src="assets/screenshots/en/audio-device.png" alt="Audio device diagnostics">
          <img class="screenshot" data-lang-img="zh-TW" style="display:none" src="assets/screenshots/zh-TW/audio-device.png" alt="音訊裝置診斷">
        </div>
        <div data-i18n-html="ts_audio_fields"></div>
        <div data-i18n-html="ts_audio_list"></div>

        <h3 data-i18n="ts_notx_title"></h3>
        <div data-i18n-html="ts_notx_list"></div>

        <h3 data-i18n="ts_timesync_title"></h3>
        <div data-i18n-html="ts_timesync_list"></div>

        <h3 data-i18n="ts_bt_title"></h3>
        <div data-i18n-html="ts_bt_list"></div>

        <h3 data-i18n="ts_report_title"></h3>
        <p data-i18n-html="ts_report_intro"></p>
        <div data-i18n-html="ts_report_list"></div>
        <div class="screenshot-wrap">
          <img class="screenshot" data-lang-img="en" src="assets/screenshots/en/debug-screen.png" alt="Debug screen">
          <img class="screenshot" data-lang-img="zh-TW" style="display:none" src="assets/screenshots/zh-TW/debug-screen.png" alt="Debug 畫面">
        </div>
        <div class="note" data-i18n-html="ts_report_note"></div>
      </section>

      <footer>
        <p data-i18n="footer_text"></p>
      </footer>

    </main>
  </div>

  <script src="assets/i18n/common.js"></script>
  <script src="assets/i18n/troubleshoot.js"></script>
  <script src="assets/layout.js"></script>
</body>
</html>
