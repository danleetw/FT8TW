<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FT8TW User Manual</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="gridtracker">

  <div class="layout">
    <main class="main-content" id="mainContent">

      <section id="gridtracker">
        <h2 data-i18n="grid_title"></h2>
        <p data-i18n="grid_intro"></p>
        <div class="screenshot-wrap">
          <img class="screenshot" data-lang-img="en" src="assets/screenshots/en/gridtracker.png" alt="Grid tracker map">
          <img class="screenshot" data-lang-img="zh-TW" style="display:none" src="assets/screenshots/zh-TW/gridtracker.png" alt="網格追蹤地圖">
        </div>
        <div data-i18n-html="grid_features"></div>
      </section>

      <footer>
        <p data-i18n="footer_text"></p>
      </footer>

    </main>
  </div>

  <script src="assets/i18n/common.js"></script>
  <script src="assets/i18n/gridtracker.js"></script>
  <script src="assets/layout.js"></script>
</body>
</html>
