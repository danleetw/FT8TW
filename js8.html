<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FT8TW User Manual</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="js8">

  <div class="layout">
    <main class="main-content" id="mainContent">

      <section id="js8">
        <h2 data-i18n="js8_title"></h2>
        <p data-i18n="js8_intro"></p>
        <div class="screenshot-wrap">
          <img class="screenshot" data-lang-img="en" src="assets/screenshots/en/js8.png" alt="JS8 chat screen">
          <img class="screenshot" data-lang-img="zh-TW" style="display:none" src="assets/screenshots/zh-TW/js8.png" alt="JS8 聊天畫面">
        </div>

        <h3 data-i18n="js8_what_title"></h3>
        <p data-i18n-html="js8_what_text"></p>
        <div data-i18n-html="js8_what_list"></div>

        <h3 data-i18n="js8_quick_title"></h3>
        <p data-i18n-html="js8_quick_text"></p>
        <div data-i18n-html="js8_quick_steps"></div>
        <div data-i18n-html="js8_quick_seq"></div>
        <div class="note" data-i18n-html="js8_quick_note"></div>

        <h3 data-i18n="js8_speed_title"></h3>
        <p data-i18n="js8_speed_text"></p>
        <div data-i18n-html="js8_speed_table"></div>

        <h3 data-i18n="js8_msg_title"></h3>
        <p data-i18n="js8_msg_text"></p>
        <div data-i18n-html="js8_msg_list"></div>

        <h3 data-i18n="js8_bubble_title"></h3>
        <p data-i18n="js8_bubble_text"></p>
        <div data-i18n-html="js8_bubble_list"></div>

        <h3 data-i18n="js8_hb_title"></h3>
        <p data-i18n="js8_hb_text"></p>

        <h3 data-i18n="js8_autoreply_title"></h3>
        <p data-i18n="js8_autoreply_text"></p>

        <h3 data-i18n="js8_unicode_title"></h3>
        <p data-i18n="js8_unicode_text"></p>

        <h3 data-i18n="js8_safety_title"></h3>
        <p data-i18n="js8_safety_text"></p>
      </section>

      <footer>
        <p data-i18n="footer_text"></p>
      </footer>

    </main>
  </div>

  <script src="assets/i18n/common.js"></script>
  <script src="assets/i18n/js8.js"></script>
  <script src="assets/layout.js"></script>
</body>
</html>
