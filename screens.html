<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FT8TW User Manual</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="screens">

  <div class="layout">
    <main class="main-content" id="mainContent">

      <section id="screens">
        <h2 data-i18n="screens_title"></h2>
        <p data-i18n="screens_intro"></p>

        <h3 data-i18n="screens_decode_title"></h3>
        <p data-i18n="screens_decode_text"></p>
        <p data-i18n="screens_decode_modes_label"></p>
        <div data-i18n-html="screens_decode_modes"></div>
        <div class="screenshot-wrap">
          <img class="screenshot" data-lang-img="en" src="assets/screenshots/en/decode.png" alt="Decode tab">
          <img class="screenshot" data-lang-img="zh-TW" style="display:none" src="assets/screenshots/zh-TW/decode.png" alt="解碼分頁">
        </div>

        <h4 data-i18n="screens_level_title"></h4>
        <p data-i18n="screens_level_text"></p>
        <div class="note" data-i18n-html="screens_level_note"></div>

        <h4 data-i18n="screens_miniwf_title"></h4>
        <p data-i18n="screens_miniwf_text"></p>

        <h3 data-i18n="screens_calling_title"></h3>
        <p data-i18n="screens_calling_text"></p>
        <div data-i18n-html="screens_calling_features"></div>
        <div class="screenshot-wrap">
          <img class="screenshot" data-lang-img="en" src="assets/screenshots/en/calling.png" alt="Calling tab">
          <img class="screenshot" data-lang-img="zh-TW" style="display:none" src="assets/screenshots/zh-TW/calling.png" alt="呼叫分頁">
        </div>

        <h3 data-i18n="screens_logs_title"></h3>
        <p data-i18n="screens_logs_text"></p>
        <div class="screenshot-wrap">
          <img class="screenshot" data-lang-img="en" src="assets/screenshots/en/logs.png" alt="QSO Logs tab">
          <img class="screenshot" data-lang-img="zh-TW" style="display:none" src="assets/screenshots/zh-TW/logs.png" alt="通聯記錄分頁">
        </div>

        <h3 data-i18n="screens_settings_title"></h3>
        <p data-i18n="screens_settings_text"></p>

        <h3 data-i18n="screens_more_title"></h3>
        <p data-i18n="screens_more_text"></p>
        <div data-i18n-html="screens_more_list"></div>
      </section>

      <footer>
        <p data-i18n="footer_text"></p>
      </footer>

    </main>
  </div>

  <script src="assets/i18n/common.js"></script>
  <script src="assets/i18n/screens.js"></script>
  <script src="assets/layout.js"></script>
</body>
</html>
